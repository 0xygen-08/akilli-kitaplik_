name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk akilli-kitaplik-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: akilli-kitaplik-latest-apk
          path: akilli-kitaplik-latest.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Akıllı Kitaplık - En Güncel APK
          files: akilli-kitaplik-latest.apk
          make_latest: true
          generate_release_notes: true
